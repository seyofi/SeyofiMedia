services:
  postgres:
    image: postgres:16
    container_name: seyofi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seyofi
      POSTGRES_PASSWORD: seyofi_dev
      POSTGRES_DB: seyofi
    ports:
      - "5432:5432"
    volumes:
      - seyofi_postgres_data:/var/lib/postgresql/data

volumes:
  seyofi_postgres_data: